name: dishrate_mobile
description: Dishrate — Yediğin her şeyi puanla.
publish_to: 'none'
# Açılış ekranı ya da ikon değişince yapı numarasını (+ sonrası) artır.
# Not: iOS açılış karesinin görüntüsünü telefonda önbelleğe alıyor ve bunu
# üzerine kurulumda silmiyor — numarayı artırmak tek başına yetmiyor,
# eski kare gidene kadar uygulamayı telefondan silip kurmak gerekiyor
# (22 Eylül'de yaşandı).
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Flutter'ın hazır bileşenlerindeki metinler (kopyala/yapıştır menüsü,
  # lisans sayfası, erişilebilirlik etiketleri) için Türkçe çeviriler.
  flutter_localizations:
    sdk: flutter

  # Navigasyon
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP İstemci
  dio: ^5.4.3+1

  # Görsel önbellekleme
  cached_network_image: ^3.3.1

  # Fontlar
  # Puan widget
  flutter_rating_bar: ^4.0.1

  # Harita
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Güvenli token saklama
  # v11: Darwin tarafı Swift Package Manager destekliyor — iOS derlemesi
  # CocoaPods olmadan çalışsın diye 9.x'ten yükseltildi.
  flutter_secure_storage: ^11.0.0

  # Tarih formatlama
  intl: ^0.20.0

  # Temel ikonlar
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  http_parser: ^4.1.2
  crop_your_image: ^2.0.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_tabler_icons: ^1.43.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

  # Marka varlıklarından uygulama ikonu + açılış ekranı üretir.
  # Ayarları aşağıdaki flutter_launcher_icons / flutter_native_splash bloklarında.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# ── Uygulama ikonu ────────────────────────────────────────────────────────────
# Kaynak: logo paketi "DISHRATE EN SON LOGO" → icon-3-orange-bg-white-d
# (turuncu zemin, beyaz `d`). Karar 22 Eylül.
# Yeniden üretmek için:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  ios: true
  remove_alpha_ios: true          # App Store saydam ikon kabul etmiyor
  android: ic_launcher
  min_sdk_android: 21
  # Android uyarlanabilir ikon: zemin turuncu, önplan saydam beyaz `d`
  # (iOS ikonuyla aynı görünsün).
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    # Web uygulamasının açılış zemini — uygulamanın evi siyah, ikonun zemini değil.
    background_color: "#0D0D0D"
    theme_color: "#FF6B35"

# ── Açılış ekranı ─────────────────────────────────────────────────────────────
# Kare **temadan bağımsız**: turuncu zemin, beyaz `d` ve beyaz yazı — uygulama
# ikonunun büyümüş hali. Sebep: bu kareyi iOS, uygulamanın kodu çalışmadan
# çiziyor; kullanıcının uygulama içi tema tercihini bilemez, yalnızca cihazın
# temasını bilir. Temaya bağlasaydık, tercihi cihazdan farklı olan kullanıcı
# her açılışta ters temada bir kare görürdü (karar 23 Eylül).
# Uygulamanın kendi açılış ekranı (SplashScreen) aynı turuncu kareyle başlar,
# sonra temanın rengine geçer; iki kare arasında fark görünmesin diye logo
# ölçüsü ve yeri birebir aynı.
# Yeniden üretmek için:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FF6B35"
  image: assets/branding/splash_logo_brand.png
  color_dark: "#FF6B35"
  image_dark: assets/branding/splash_logo_brand.png
  android_12:
    # Android 12+ açılışı yuvarlak maskeli tek ikon ister — yazı sığmaz,
    # bu yüzden yalnızca işaret kullanılır.
    image: assets/branding/splash_android12.png
    icon_background_color: "#FF6B35"
    color: "#FF6B35"
    image_dark: assets/branding/splash_android12.png
    icon_background_color_dark: "#FF6B35"
    color_dark: "#FF6B35"
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/
    - assets/data/
    # Uygulamadaki "Açık kaynak lisansları" sayfasında gösterilir (OFL şartı).
    - assets/fonts/URBANIST-OFL.txt
    - assets/fonts/POPPINS-OFL.txt

  # Aktif arayüz fontu AppFonts.active ile seçilir (lib/core/theme/app_fonts.dart);
  # logo yazısı ("dishrate") her zaman Poppins'tir (AppFonts.wordmark).
  fonts:
    # Logo kelime markası ("dishrate") ve karşılaştırma için.
    # Kaynak: github.com/itfoundry/Poppins (SIL OFL, lisans assets/fonts/POPPINS-OFL.txt).
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

    # Arayüz fontu. Türkçe harflerin tamamı var; fi/fl bitişik harfi yok.
    # Kaynak: github.com/coreyhu/Urbanist (SIL OFL, lisans assets/fonts/URBANIST-OFL.txt).
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Urbanist-Black.ttf
          weight: 900
