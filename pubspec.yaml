name: dishrate_mobile
description: Decouva — Yediğin her şeyi puanla.
publish_to: 'none'
# Açılış ekranı ya da ikon değişince yapı numarasını (+ sonrası) artır.
# Not: iOS açılış karesinin görüntüsünü telefonda önbelleğe alıyor ve bunu
# üzerine kurulumda silmiyor — numarayı artırmak tek başına yetmiyor,
# eski kare gidene kadar uygulamayı telefondan silip kurmak gerekiyor
# (22 Eylül'de yaşandı).
version: 1.0.0+9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Flutter'ın hazır bileşenlerindeki metinler (kopyala/yapıştır menüsü,
  # lisans sayfası, erişilebilirlik etiketleri) için Türkçe çeviriler.
  flutter_localizations:
    sdk: flutter

  # Navigasyon
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP İstemci
  dio: ^5.4.3+1

  # Görsel önbellekleme
  cached_network_image: ^3.3.1

  # Fontlar
  # Puan widget
  flutter_rating_bar: ^4.0.1

  # Harita
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Güvenli token saklama
  # v11: Darwin tarafı Swift Package Manager destekliyor — iOS derlemesi
  # CocoaPods olmadan çalışsın diye 9.x'ten yükseltildi.
  flutter_secure_storage: ^11.0.0

  # Tarih formatlama
  intl: ^0.20.0

  # Temel ikonlar
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  http_parser: ^4.1.2
  crop_your_image: ^2.0.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_tabler_icons: ^1.43.0
  shared_preferences: ^2.5.5
  # "Bize ulaş" posta uygulamasını, gizlilik politikası web sayfasını açar.
  url_launcher: ^6.3.2
  # Ayarlar'daki sürüm uygulamanın gerçek sürümünden okunur (elle yazılmaz).
  package_info_plus: ^10.2.1
  # Logo (17 Ekim): SVG'ler assets/brand/svg/ (bkz. shared/widgets/brand_logo.dart).
  flutter_svg: ^2.0.10
  # Tanıtımın son sayfasındaki (A4) logo animasyonu, assets/brand/video/.
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

  # Marka varlıklarından uygulama ikonu + açılış ekranı üretir.
  # Ayarları aşağıdaki flutter_launcher_icons / flutter_native_splash bloklarında.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# ── Uygulama ikonu ────────────────────────────────────────────────────────────
# Kaynak: logo paketi "decouva-logo-paketi" (17 Ekim; repo dışı, üst klasörde).
# Koyu zemin (#0D0D0D) + pul yığını. iOS ikonu paketin AppIcon-1024'ü değil:
# amblem ana ekranda küçük duruyordu (genişliğin %74'ü), paketin amblem.png'sinden
# %15 büyük (genişliğin %85'i, ortalı) yeniden üretildi (Emir, 17 Ekim). Android
# ön planı paketteki gibi (güvenli alan küçük).
# Yeniden üretmek için:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon/app_icon.png
  ios: true
  remove_alpha_ios: true          # App Store saydam ikon kabul etmiyor
  # iOS 18+ koyu ve renkli ikon görünümleri (sistem yalnız o görünümler
  # seçiliyken kullanır, ör. koyu moddaki Spotlight). Pakette yok; paketin
  # PNG'lerinden ana ikondaki amblemle aynı yer ve ölçüde üretildi (17 Ekim):
  # koyu = saydam zemin + renkli amblem, renkli = siyah zemin + beyaz amblem.
  image_path_ios_dark_transparent: assets/brand/icon/ios_dark.png
  image_path_ios_tinted_grayscale: assets/brand/icon/ios_tinted.png
  android: ic_launcher
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: assets/brand/icon/android_foreground.png
  adaptive_icon_monochrome: assets/brand/icon/android_monochrome.png
  web:
    generate: true
    image_path: assets/brand/icon/app_icon.png
    background_color: "#0D0D0D"
    theme_color: "#0D0D0D"

# ── Açılış ekranı ─────────────────────────────────────────────────────────────
# Kare **temadan bağımsız**: siyah zemin (#0D0D0D) + dikey logo (pul yığını,
# altında beyaz "decouva"), karar 17 Ekim. Sebep (23 Eylül'den beri aynı): bu
# kareyi iOS, uygulamanın kodu çalışmadan çiziyor; kullanıcının uygulama içi
# tema tercihini bilemez. Uygulamanın açılış ekranı (SplashScreen) aynı kareyle
# başlar, sonra temanın rengine geçer; logonun ölçüsü ve yeri birebir aynı.
# Görsel @4x okunuyor: splash.png'deki logo 680 px = ekranda 170 pt.
# Yeniden üretmek için:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0D0D0D"
  image: assets/brand/splash/splash.png
  color_dark: "#0D0D0D"
  image_dark: assets/brand/splash/splash.png
  android_12:
    # Android 12+ açılışı yuvarlak maskeli tek ikon ister — yazı sığmaz,
    # bu yüzden yalnız amblem.
    image: assets/brand/splash/android12.png
    icon_background_color: "#0D0D0D"
    color: "#0D0D0D"
    image_dark: assets/brand/splash/android12.png
    icon_background_color_dark: "#0D0D0D"
    color_dark: "#0D0D0D"
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/brand/svg/
    - assets/brand/video/
    - assets/data/
    # Tanıtım fotoğrafları (Unsplash License, atıf zorunlu değil).
    - assets/onboarding/
    - assets/onboarding/card/
    - assets/onboarding/plate/
    # Uygulamadaki "Açık kaynak lisansları" sayfasında gösterilir (OFL şartı).
    - assets/fonts/URBANIST-OFL.txt
    - assets/fonts/POPPINS-OFL.txt
    - assets/fonts/IBMPLEXMONO-OFL.txt

  # Aktif arayüz fontu AppFonts.active ile seçilir (lib/core/theme/app_fonts.dart).
  # Logo yazısı font değil, SVG (assets/brand/svg/).
  fonts:
    # Font karşılaştırması için (APP_FONT=Poppins).
    # Kaynak: github.com/itfoundry/Poppins (SIL OFL, lisans assets/fonts/POPPINS-OFL.txt).
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

    # Arayüz fontu. Türkçe harflerin tamamı var; fi/fl bitişik harfi yok.
    # Kaynak: github.com/coreyhu/Urbanist (SIL OFL, lisans assets/fonts/URBANIST-OFL.txt).
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Urbanist-Black.ttf
          weight: 900

    # Adisyon (1.9): fiş yazısı, sabit genişlikli. Yalnız adisyonda kullanılır.
    # Kaynak: github.com/google/fonts/ofl/ibmplexmono (SIL OFL, lisans assets/fonts/IBMPLEXMONO-OFL.txt).
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
