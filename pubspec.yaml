name: dishrate_mobile
description: Dishrate — Yediğin her şeyi puanla.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigasyon
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP İstemci
  dio: ^5.4.3+1

  # Görsel önbellekleme
  cached_network_image: ^3.3.1

  # Fontlar
  google_fonts: ^6.2.1

  # Puan widget
  flutter_rating_bar: ^4.0.1

  # Temel ikonlar
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
